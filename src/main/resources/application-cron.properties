# Cron Job Configuration Properties
# Spring @Scheduled cron expressions

# Cron Expression Examples:
# ┌───────────── second (0-59)
# │ ┌───────────── minute (0-59)
# │ │ ┌───────────── hour (0-23)
# │ │ │ ┌───────────── day of the month (1-31)
# │ │ │ │ ┌───────────── month (1-12)
# │ │ │ │ │ ┌───────────── day of the week (0-7)
# │ │ │ │ │ │
# * * * * * *

# Cron Job Schedules
cron.job.every.minute=0 * * * * *
cron.job.every.five.minutes=0 */5 * * * *
cron.job.every.hour=0 0 * * * *
cron.job.daily.midnight=0 0 0 * * *
cron.job.daily.9am=0 0 9 * * *
cron.job.weekly.monday=0 0 8 ? * MON
cron.job.monthly.first.day=0 0 0 1 * ?
cron.job.weekdays.9am=0 0 9 ? * MON-FRI
cron.job.weekends.10am=0 0 10 ? * SAT-SUN
cron.job.business.hours.30s=*/30 * 9-17 * * MON-FRI
cron.job.business.hours.15m=0/15 * 9-17 * * MON-FRI
cron.job.custom.every.2.hours=0 0 8-20/2 * * *
cron.job.data.backup=0 0 2 * * *
cron.job.system.cleanup=0 0 3 ? * SUN
cron.job.report.generation=0 0 17 ? * MON-FRI
cron.job.health.check=0 */10 * * * *

# Cron Job Settings
cron.job.enabled=true
cron.job.timezone=UTC
cron.job.pool.size=10
cron.job.shutdown.timeout=30

# Cron Job Logging
cron.job.logging.enabled=true
cron.job.logging.level=INFO
