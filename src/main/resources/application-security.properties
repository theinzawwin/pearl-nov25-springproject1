# Spring Security Configuration
# JWT Configuration
jwt.secret=mySecretKey123456789012345678901234567890
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Security Settings
security.require-ssl=false
security.allowed-origins=http://localhost:3000,http://localhost:8080
security.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
security.allowed-headers=*

# Authentication
auth.login-endpoint=/auth/login
auth.register-endpoint=/auth/register
auth.refresh-endpoint=/auth/refresh

# Role-based Access
roles.admin=ADMIN
roles.manager=MANAGER
roles.user=USER

# Session Management
session.timeout=30m
session.cookie-name=JSESSIONID
session.cookie-http-only=true
session.cookie-secure=false

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# Password Policy
password.min-length=6
password.max-length=100
password.require-uppercase=true
password.require-lowercase=true
password.require-digit=true
password.require-special-char=false

# Account Lockout
account.lockout.enabled=true
account.lockout.max-attempts=5
account.lockout.duration=30m

# Token Validation
token.validation.enabled=true
token.validation.clock-skew=30s
token.validation.issuer=springproj1
token.validation.audience=springproj1-users
